# Main method: all hard-negative types
name: full_all_negs
model: openai/clip-vit-base-patch32
negatives_file: data/negatives.jsonl
image_dir: data/coco_subset/images
use_negatives: true
neg_types: null                          # null = all types; or e.g. [obj_swap, attr_swap]
max_samples: 50000
epochs: 3
batch_size: 128
lr: 5.0e-6
weight_decay: 0.1
warmup_steps: 200
num_workers: 2
fp16: true
